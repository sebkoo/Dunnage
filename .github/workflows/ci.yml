name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Four jobs rather than four steps in one. build-and-test, cloud-stack and
# commit-message-hygiene need different machines and different clones — Xcode against a
# shallow checkout, Node against a second one, awk against the whole history — and they
# assert unrelated things. A red suite must not hide a fabricated attribution, or the
# reverse.
#
# docs-agree holds the two doc guards. They are a job of their own for a different
# reason: the name guard reconciles docs/invariants.md against the names the test runners
# report, and the document names every test there is, whichever runner has it. The guard
# therefore needs every runner's list at once, and a guard running inside a build job
# sees only that job's own. Each build job uploads the names it has; docs-agree downloads
# them and does the comparison. There are two such jobs from this commit on, and the
# comparison is against their union.
#
# It runs after both build jobs because it consumes their artifacts, and for no other
# reason. needs: gates on success, so a failing build skips docs-agree entirely and a doc
# that disagrees with a suite stays hidden behind the compile error until the build is
# fixed. Moving the guards out did not decouple them from the builds.
jobs:
  build-and-test:
    name: build and test
    # Pinned. macos-latest moves between macOS versions, and moving it silently changes
    # the toolchain this job is supposed to be running against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select the toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version          # Xcode 26.6 on this image: Swift 6.3.3

      # No AWS credentials, no SSO session, no cloud config of any kind: that this passes is the architectural claim — Core is pure and needs none.
      - name: Build and test
        run: swift build && swift test

      # The LC_ALL=C pinned on the sort below is not decoration. sort orders by the
      # locale's collation and -u deduplicates by it, so the locale decides not only the
      # order of this file but which lines survive it: two byte-wise distinct names that
      # collate equal under whatever locale a runner happens to have would leave one line,
      # and no re-sorting downstream recovers a name already dropped. Pinned, the artifact
      # is the same set of names whichever machine wrote it, and membership — not merely
      # order — is what the guard that reads it is entitled to assume. Another job that
      # uploads a list of names for that guard pins its own sort the same way.
      #
      # It prints one line per test as `Module.ClassName/testName`, and only the last
      # column is a test name. Hence the cut to that column before the grep. Grepping the
      # whole line read the module and class columns too and matched a test name in either
      # of them: a class or a module spelled `testSomething` would be recorded as a test,
      # and docs-agree would then demand the document name a test that does not exist.
      # Nothing here is spelled that way today, which is luck and not a property anyone
      # maintains. The cut costs nothing in the other direction: a test name is a Swift
      # identifier and a Swift identifier cannot contain a slash, so no real name can be
      # truncated by it.
      - name: Record the test names this runner has
        run: |
          set -u
          swift test list | awk -F/ '{print $NF}' | grep -oE 'test[A-Z][A-Za-z0-9_]*' | LC_ALL=C sort -u > swift-test-names.txt
          echo "$(wc -l < swift-test-names.txt | tr -d '[:space:]') test names recorded"
      - uses: actions/upload-artifact@v7
        with:
          name: swift-test-names
          path: swift-test-names.txt

  cloud-stack:
    name: cloud stack
    # Pinned for the same reason. Nothing here needs macOS, and nothing here needs an AWS
    # credential either: the handlers are pure functions and the tests never leave the
    # runner.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      # --ignore-scripts because this is the one step in the phase that runs unaudited
      # third-party code, on a runner holding a token. Nothing in the dependency set needs
      # a lifecycle script: esbuild's platform binary arrives as an optional dependency
      # and its shim resolves it (0.28.2, checked). If a future dependency does need one,
      # that is a decision to take deliberately, in a commit that says which package and
      # why.
      #
      # npm ci and not npm install: it installs the committed lockfile exactly and fails
      # if package.json and the lockfile have drifted apart, which is the whole point of
      # committing one.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      # This is the other job the comment above build-and-test's producer names. LC_ALL=C
      # is pinned here for that reason and no other: sort -u deduplicates by collation, so
      # an unpinned sort here would decide which names survive into the artifact, and no
      # re-sorting in docs-agree recovers a name already dropped.
      #
      # `vitest list` and not a grep over the sources: a source grep counts a skipped test
      # as a real one, and the guard downstream would then be reconciling the document
      # against tests nothing runs.
      #
      # It prints one line per test as `file > describe > test`, and only the last column
      # is a test name. Hence the cut to that column before the grep. Grepping the whole
      # line read the file and describe columns too and matched a test name in either of
      # them: a describe block or a path component spelled `testSomething` would be
      # recorded as a test, and docs-agree would then demand the document name a test that
      # does not exist. Nothing here is spelled that way today, which is luck and not a
      # property anyone maintains. Nested describes add columns rather than moving the
      # test, so the last column is the test name however deep it is.
      - name: Record the test names this runner has
        run: |
          set -u
          npx vitest list | awk -F ' > ' '{print $NF}' | grep -oE 'test[A-Z][A-Za-z0-9_]*' | LC_ALL=C sort -u > vitest-test-names.txt
          echo "$(wc -l < vitest-test-names.txt | tr -d '[:space:]') test names recorded"
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-test-names
          path: cloud/vitest-test-names.txt

  docs-agree:
    name: docs agree
    # Pinned for the same reason.
    runs-on: ubuntu-24.04
    needs: [build-and-test, cloud-stack]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: swift-test-names
      - uses: actions/download-artifact@v8
        with:
          name: vitest-test-names

      # A doc that can drift from the suites is worse than a doc that names no tests at
      # all. Renaming a test fails this job until docs/invariants.md is updated; the
      # build itself still passes. That is the point of this step, not a side effect of
      # it.
      #
      # It greps the whole file, not one section of it, so where in docs/invariants.md
      # the names are written is free to change. What is enforced is that every name in
      # either suite appears somewhere in the file, and that nothing shaped like a test
      # name appears in the file which is not one.
      #
      # One document, two suites, one comparison. docs/invariants.md names every test
      # there is, whichever runner has it, so the side it is compared against is the
      # union of the lists the runners uploaded — not one list per runner. A per-runner
      # comparison would fail every name the other runner owns.
      #
      # The sides of the comparison are produced on three different machines — each
      # suite's names are sorted and uploaded by its own build job's runner, the
      # document's are grepped here — and diff compares lines in order, so one set in two
      # orders is a disagreement. Hence the pinned collation on every sort below. It is
      # what makes this guard independent of its producers: an artifact is a set, its
      # order is not the producer's to guarantee, and this comparison must not depend on
      # which machine wrote the files it reads. Each producer pins its own sort as well,
      # for a reason of its own — sort -u deduplicates by collation, so an unpinned
      # producer would decide its artifact's membership and not merely its order.
      #
      # Sets, then, not sequences. The claims guard below compares its two lists in order
      # deliberately, and says so; here the order carries nothing, and sorting every side
      # under one collation is what makes "the same names" a question three machines can
      # answer the same way.
      - name: docs/invariants.md names the tests that exist
        run: |
          set -u
          # A runner that reported nothing produces an empty list, not an error, and an
          # empty list unions away without trace: the guard would then be reconciling the
          # document against the other runner alone and passing green. Each list has to
          # be non-empty before it is used, and this is checked per file so one run names
          # every runner that went silent.
          empty=0
          for f in swift-test-names.txt vitest-test-names.txt; do
            [ -s "$f" ] || { echo "::error::$f is empty — a runner reported no test names, and an empty list unions away without trace"; empty=1; }
          done
          [ "$empty" -eq 0 ] || exit 1
          names=$(cat swift-test-names.txt vitest-test-names.txt | LC_ALL=C sort -u)
          diff <(grep -oE 'test[A-Z][A-Za-z0-9_]*' docs/invariants.md | LC_ALL=C sort -u) <(printf '%s\n' "$names") \
            || { echo "::error::docs/invariants.md and the suites disagree — '<' is in the doc only, '>' is in a suite only"; exit 1; }
          echo "$(printf '%s\n' "$names" | wc -l) test names across both suites, docs/invariants.md and the suites agree"

      # Both files state the claims, and that duplication is deliberate: each has to be
      # readable on its own, and the claims are what makes either one readable. Nothing
      # else reconciles the two copies — the step above reads only docs/invariants.md, so
      # a claim reworded in one file and not the other clears every other check here.
      #
      # Compared in order, not as sets. A phase's claims are a deliberate sequence, and a
      # reader holding the two files side by side should not have to hunt.
      #
      # The count guard is the substance of this step, not paperwork around it. Each side
      # is extracted by pattern — a list marker here, a heading level there — and a pattern
      # that stops matching returns an empty list, not an error. A renamed section or a
      # changed heading level would empty one side; two empty lists diff clean, and the
      # step would pass green forever while reading nothing. Landing an invariant is a
      # deliberate act: land it, then change its phase's number below.
      - name: README and docs/invariants.md state the same claims, phase by phase
        run: |
          set -u
          failed=0
          check() {                        # check PHASE EXPECTED
            phase=$1; expected=$2
            readme=$(mktemp); doc=$(mktemp)
            sed -n "/^## Phase $phase: /,/^## /p" README.md          | sed -n 's/^- //p'   > "$readme"
            sed -n "/^## Phase $phase: /,/^## /p" docs/invariants.md | sed -n 's/^### //p' > "$doc"
            rn=$(wc -l < "$readme" | tr -d '[:space:]')
            dn=$(wc -l < "$doc" | tr -d '[:space:]')
            if [ "$rn" -ne "$expected" ] || [ "$dn" -ne "$expected" ]; then
              echo "::error::phase $phase: the claim extraction is broken, so this step read nothing it could compare — expected $expected claims on each side, README.md gave $rn and docs/invariants.md gave $dn"
              failed=1
              return
            fi
            if ! diff "$readme" "$doc"; then
              echo "::error::phase $phase: the claims disagree — '<' is in README.md only, '>' is in docs/invariants.md only"
              failed=1
              return
            fi
            echo "phase $phase: $expected claims, README.md and docs/invariants.md agree, in the same order"
          }
          check 1 9
          check 2 6
          check 3 7
          check 4a 1
          exit $failed

  commit-message-hygiene:
    name: commit message hygiene
    # Pinned for the same reason. This job needs git and awk, nothing else.
    runs-on: ubuntu-24.04
    # The commit-msg hook cannot be the enforcement layer: rebase, cherry-pick and
    # --no-verify all skip it, and a clone does not install it at all. This job is the
    # layer that sees the history as pushed.
    #
    # It is a policy implementation, not an independent verifier. The classifier it runs
    # is the copy in the commit under test, so a commit that edits .githooks/attribution.awk
    # is judged by its own edited rules. Review changes to that file as production code.
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit message means every commit message. A shallow clone would pass
          # over a history it never fetched.
          fetch-depth: 0

      - name: Attribution trailers
        run: |
          set -u
          checked=0; found=0
          for sha in $(git rev-list HEAD); do
            checked=$((checked + 1))
            # attribution.awk is the one definition of a prohibited line form, and it
            # reads trailer shapes, not prose. A body that names a vendor is not a claim
            # of authorship; grepping the body would fail those commits.
            git log -1 --format=%B "$sha" \
              | LC_ALL=C awk -f .githooks/attribution.awk -v mode=detect -v label="$sha  " \
              || found=1
          done
          echo "$checked commit messages classified"
          [ "$found" -eq 0 ] || { echo "::error::prohibited attribution trailer, listed above"; exit 1; }

      # Runs even when the step above failed, so one run reports both audits.
      - name: Author and committer identity
        if: ${{ !cancelled() }}
        run: |
          set -u
          # Narrow on purpose, for the reason attribution.awk gives about trailers: a
          # rule wide enough to catch every mention of the vendor also rejects people.
          # Each field is tested on its own terms — the name for equality, the email
          # for its domain — so Jean-Claude Martin and Claude Dupont <claude@corp.com>
          # are contributors, not tooling.
          tooling() {                       # tooling NAME EMAIL
            name=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            mail=$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')
            [ "$name" = "claude" ] && return 0
            case "$mail" in *@anthropic.com|*.anthropic.com) return 0 ;; esac
            return 1
          }
          checked=0; found=0
          for sha in $(git rev-list HEAD); do
            checked=$((checked + 1))
            an=$(git log -1 --format='%an' "$sha")
            ae=$(git log -1 --format='%ae' "$sha")
            cn=$(git log -1 --format='%cn' "$sha")
            ce=$(git log -1 --format='%ce' "$sha")
            if tooling "$an" "$ae" || tooling "$cn" "$ce"; then
              echo "$sha  author $an <$ae> | committer $cn <$ce>"
              found=1
            fi
          done
          echo "$checked author and committer identities checked"
          [ "$found" -eq 0 ] || { echo "::error::commit recorded under a tooling identity, listed above"; exit 1; }
