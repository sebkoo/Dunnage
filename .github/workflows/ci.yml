name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Five jobs rather than five steps in one. build-and-test, cloud-stack, app-simulator and
# commit-message-hygiene need different machines and different clones — Xcode against a
# shallow checkout, Node against a second one, a booted simulator against a third, awk
# against the whole history — and they assert unrelated things. A red suite must not hide
# a fabricated attribution, or the reverse, and a red tier 2 must not hide a green
# `swift test` (spec §10).
#
# docs-agree holds the two doc guards. They are a job of their own for a different
# reason: the name guard reconciles docs/invariants.md against the names the test runners
# report, and the document names every test there is, whichever runner has it. The guard
# therefore needs every runner's list at once, and a guard running inside a build job
# sees only that job's own. Each build job uploads the names it has; docs-agree downloads
# them and does the comparison. There are three such jobs from this commit on, and the
# comparison is against their union.
#
# It runs after all three because it consumes their artifacts, and for no other reason.
# needs: gates on success, so a failing build skips docs-agree entirely and a doc that
# disagrees with a suite stays hidden behind the compile error until the build is fixed.
# Moving the guards out did not decouple them from the builds.
jobs:
  build-and-test:
    name: build and test
    # Pinned. macos-latest moves between macOS versions, and moving it silently changes
    # the toolchain this job is supposed to be running against.
    runs-on: macos-26
    # The only backstop this job has against a hung test. `swift test` enforces no per-test
    # timeout and names nothing: with output captured, a hung test prints not one line for
    # as long as it runs (ADR-0007 O-17), and without this the job would be cancelled at
    # GitHub's six-hour default naming no test at all. Ten minutes is about ten times the
    # observed worst — 47 s, 53 s and 57 s on the last three green runs on main — because
    # it bounds the whole job and not one test, and a bound that tight would be a flake.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Select the toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          swift --version          # Xcode 26.6 on this image: Swift 6.3.3

      # No AWS credentials, no SSO session, no cloud config of any kind: that this passes is the architectural claim — Core is pure and needs none.
      - name: Build and test
        run: swift build && swift test

      # The LC_ALL=C pinned on the sort below is not decoration. sort orders by the
      # locale's collation and -u deduplicates by it, so the locale decides not only the
      # order of this file but which lines survive it: two byte-wise distinct names that
      # collate equal under whatever locale a runner happens to have would leave one line,
      # and no re-sorting downstream recovers a name already dropped. Pinned, the artifact
      # is the same set of names whichever machine wrote it, and membership — not merely
      # order — is what the guard that reads it is entitled to assume. Another job that
      # uploads a list of names for that guard pins its own sort the same way.
      #
      # It prints one line per test as `Module.ClassName/testName`, and only the last
      # column is a test name. Hence the cut to that column before the grep. Grepping the
      # whole line read the module and class columns too and matched a test name in either
      # of them: a class or a module spelled `testSomething` would be recorded as a test,
      # and docs-agree would then demand the document name a test that does not exist.
      # Nothing here is spelled that way today, which is luck and not a property anyone
      # maintains. The cut costs nothing in the other direction: a test name is a Swift
      # identifier and a Swift identifier cannot contain a slash, so no real name can be
      # truncated by it.
      - name: Record the test names this runner has
        run: |
          set -u
          swift test list | awk -F/ '{print $NF}' | grep -oE 'test[A-Z][A-Za-z0-9_]*' | LC_ALL=C sort -u > swift-test-names.txt
          echo "$(wc -l < swift-test-names.txt | tr -d '[:space:]') test names recorded"
      - uses: actions/upload-artifact@v7
        with:
          name: swift-test-names
          path: swift-test-names.txt

  cloud-stack:
    name: cloud stack
    # Pinned for the same reason. Nothing here needs macOS, and nothing here needs an AWS
    # credential either: what a test reaches is a pure function or the path a handler takes
    # before it constructs a client, and nothing in this job leaves the runner.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      # --ignore-scripts because this is the one step in the phase that runs unaudited
      # third-party code, on a runner holding a token. Nothing in the dependency set needs
      # a lifecycle script: esbuild's platform binary arrives as an optional dependency
      # and its shim resolves it (0.28.2, checked). If a future dependency does need one,
      # that is a decision to take deliberately, in a commit that says which package and
      # why.
      #
      # npm ci and not npm install: it installs the committed lockfile exactly and fails
      # if package.json and the lockfile have drifted apart, which is the whole point of
      # committing one.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

      # Before the tests, because the suite reads a synthesised template and synthesising one
      # stages the Lambda asset out of dist/handlers — a directory only this step writes. It
      # is not needed before the name-recording step below: `vitest list` imports the test
      # files to collect them and constructs no stack, which holds only because
      # `Template.fromStack` is called inside the tests and never at module scope.
      #
      # It also compiles bin/dunnage.ts to dist/app.js, which is what cdk.json runs. There is
      # no TypeScript loader in the dependency set: ts-node cannot run under the pinned
      # typescript 7.0.2 — TypeScript 7's main entry no longer exposes the legacy compiler
      # API, so ts-node throws during bootstrap — and the app is compiled by the esbuild that
      # already builds the handlers rather than by a loader added for the purpose. The app
      # bundle is --packages=external, so aws-cdk-lib is required from node_modules and its
      # vendored custom-resource handlers still resolve relative to their own __dirname.
      - run: npm run build

      # The stand-in is a test double, and `Code.fromAsset('dist/handlers')` uploads a
      # directory. A bundle emitted into that directory would be a test double inside a
      # production Lambda asset, and nothing else in this repository would notice: the
      # asset is staged by name, not by contents. So the emitted set is named here, and
      # the synthesised template is read for any mention of the stand-in at all. Both
      # checks run and both report — a broken first one must not hide the second.
      - name: The stand-in is beside the handler asset, never inside it and never in the stack
        run: |
          set -u
          failed=0
          bundles=$(ls dist/handlers | LC_ALL=C sort | tr '\n' ' ')
          [ "$bundles" = "complete.js create.js parts.js urls.js " ] \
            || { echo "::error::dist/handlers holds '$bundles' — Code.fromAsset uploads that directory, and only the four handler bundles belong in it"; failed=1; }
          test -f dist/standin.js \
            || { echo "::error::dist/standin.js was not built — the stand-in's bundle is the artifact the simulator job runs"; failed=1; }
          mentions=$(npx cdk synth --no-lookups 2>/dev/null | grep -ci standin || true)
          [ "$mentions" -eq 0 ] \
            || { echo "::error::the synthesised template mentions the stand-in $mentions times — a test double reached the deployed stack"; failed=1; }
          echo "dist/handlers holds exactly: $bundles"
          echo "dist/standin.js exists beside it, $(wc -c < dist/standin.js | tr -d '[:space:]') bytes, and the synthesised template mentions the stand-in $mentions times"
          exit $failed

      # The bundle the simulator job runs. It is built once, here, and downloaded there:
      # no second `npm ci` on a macOS runner (spec §3 rider a).
      - uses: actions/upload-artifact@v7
        with:
          name: standin
          path: cloud/dist/standin.js

      - run: npm test

      # The two steps below are claim 1's, and each defends a property that fails quietly.
      #
      # The first is a guard, not a negative control: cdk.context.json is a cached answer to a
      # question that needed a credential once, so its presence means a synth resolved
      # something from an account. A file-absence assertion demonstrates nothing failing, and
      # this phase's negative control is claim 6.
      #
      # The second synthesises with the AWS environment scrubbed rather than merely absent.
      # This runner holds no credential today, so a bare synth would pass for that reason and
      # keep passing for a different one the day the job gains OIDC. AWS_ROLE_ARN and
      # AWS_WEB_IDENTITY_TOKEN_FILE are the two that matter: they are how a runner starts
      # resolving an identity without anyone editing this file.
      - name: No context file — a synth that needed a credential once and cached the answer
        run: |
          set -u
          test ! -e cdk.context.json \
            || { echo "::error::cloud/cdk.context.json exists — a synth resolved something from an account"; exit 1; }
          echo "no cdk.context.json: nothing here resolved anything from an account"
      - name: Synthesise with the AWS environment scrubbed, not merely absent
        run: |
          set -u
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN \
              -u AWS_PROFILE -u AWS_REGION -u AWS_DEFAULT_REGION \
              -u AWS_ROLE_ARN -u AWS_WEB_IDENTITY_TOKEN_FILE \
              -u CDK_DEFAULT_ACCOUNT -u CDK_DEFAULT_REGION \
              AWS_EC2_METADATA_DISABLED=true AWS_CONFIG_FILE=/dev/null \
              AWS_SHARED_CREDENTIALS_FILE=/dev/null \
              npx cdk synth --no-lookups > "$RUNNER_TEMP/scrubbed.yaml"
          echo "$(wc -c < "$RUNNER_TEMP/scrubbed.yaml") bytes synthesised with the AWS environment scrubbed"

      # This is the other job the comment above build-and-test's producer names. LC_ALL=C
      # is pinned here for that reason and no other: sort -u deduplicates by collation, so
      # an unpinned sort here would decide which names survive into the artifact, and no
      # re-sorting in docs-agree recovers a name already dropped.
      #
      # `vitest list` and not a grep over the sources: a source grep counts a skipped test
      # as a real one, and the guard downstream would then be reconciling the document
      # against tests nothing runs.
      #
      # It prints one line per test as `file > describe > test`, and only the last column
      # is a test name. Hence the cut to that column before the grep. Grepping the whole
      # line read the file and describe columns too and matched a test name in either of
      # them: a describe block or a path component spelled `testSomething` would be
      # recorded as a test, and docs-agree would then demand the document name a test that
      # does not exist. Nothing here is spelled that way today, which is luck and not a
      # property anyone maintains. Nested describes add columns rather than moving the
      # test, so the last column is the test name however deep it is.
      - name: Record the test names this runner has
        run: |
          set -u
          npx vitest list | awk -F ' > ' '{print $NF}' | grep -oE 'test[A-Z][A-Za-z0-9_]*' | LC_ALL=C sort -u > vitest-test-names.txt
          echo "$(wc -l < vitest-test-names.txt | tr -d '[:space:]') test names recorded"
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-test-names
          path: cloud/vitest-test-names.txt

  app-simulator:
    name: app simulator
    # Pinned for the same reason as build-and-test, and macOS because this job boots a
    # simulator and runs xcodebuild.
    runs-on: macos-26
    # The outer bound, for the reason build-and-test has one. Thirty because this job
    # builds, boots a device and runs two bundles: 6m07s and 10m49s on the last two green
    # runs on main. The flags on the test step below bound test execution alone, and
    # neither the build nor the boot nor the enumeration, which is why this one is here too.
    timeout-minutes: 30
    # The stand-in's bundle is cloud-stack's artifact. needs: gates on success, so a red
    # cloud stack skips this job rather than running the app against a bundle nobody
    # checked.
    needs: [cloud-stack]
    steps:
      - uses: actions/checkout@v7

      - name: Select the toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version        # Xcode 26.6 on this image

      - uses: actions/download-artifact@v8
        with:
          name: standin
          path: standin-bundle

      # Its own step, and before anything that has a bound on it. A first boot of a fresh
      # device takes minutes, and a minute of it spent inside a test's own wait would make
      # that wait a measurement of the image rather than of the app (spec §10 rider a).
      # bootstatus -b brings its own bound and prints its own progress.
      - name: Create and boot the simulator
        run: |
          set -u
          start=$(date +%s)
          # iPhone 17 on iOS 26.5, the newest runtime the pinned Xcode ships on this image.
          udid=$(xcrun simctl create dunnage-ci "iPhone 17" "com.apple.CoreSimulator.SimRuntime.iOS-26-5")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "booted $udid on iOS 26.5 in $(( $(date +%s) - start )) seconds"

      # The port is the operating system's, and the stand-in prints the one it was given.
      # Read from its own stdout rather than assumed: a fixed port is a port another
      # process on the runner may already hold, and the failure would be a bind error in
      # the middle of a test's wait.
      #
      # The wait is a bounded count of tries with a message on reaching it, like every
      # other wait this phase takes. No step in this job pauses for a fixed interval.
      - name: Start the stand-in
        shell: bash
        run: |
          set -u
          # Its stdout is read directly, so each try is a wait for a line and not a pause:
          # `read -t` returns when the line arrives, or when the try's second is up.
          exec 3< <(node standin-bundle/standin.js --port 0 2>&1)
          port=""; seen=""
          for _ in $(seq 1 30); do
            IFS= read -r -t 1 line <&3 || continue
            seen="$seen$line"$'\n'
            case "$line" in
              "listening on http://127.0.0.1:"*) port=${line##*:}; break ;;
            esac
          done
          [ -n "$port" ] \
            || { echo "::error::the stand-in did not print a port within 30 s"; printf '%s' "$seen"; exit 1; }
          echo "STANDIN_PID=$(pgrep -f 'standin-bundle/standin.js' | head -1)" >> "$GITHUB_ENV"
          echo "STANDIN_BASE_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "the stand-in is listening on http://127.0.0.1:$port"

      # A guard, not a negative control, like 4a's context-file check: it demonstrates
      # nothing failing. What it defends is that a fresh clone builds with no operator's
      # file present — the step below is the proof — and that no committed file carries a
      # person's or an employer's team identifier. Both checks run and both report; a
      # broken first one must not hide the second.
      - name: The committed project names no team and carries no operator's file
        run: |
          set -u
          failed=0
          teams=$(grep -rn "DEVELOPMENT_TEAM" App/ | grep -v "= *$" || true)
          [ -z "$teams" ] \
            || { echo "::error::a committed file sets a team identifier: $teams"; failed=1; }
          if [ -e App/Local.xcconfig ]; then
            echo "::error::App/Local.xcconfig is committed — it is an operator's own file and is gitignored"
            failed=1
          fi
          echo "no committed file under App/ sets a team identifier, and App/Local.xcconfig is absent"
          exit $failed

      # The negative control is the app's alone, and a release build must not carry it.
      # Two checks, both of which run and both of which report: a broken first one must
      # not hide the second, the way 4a's control check is written.
      #
      # The first reads a Release build's symbols, grepped case-insensitively for the
      # control's name. `#if DEBUG` is a compilation condition and not a promise, and this
      # is what turns it into one — provided the read is shown to be able to see one.
      #
      # It reads every symbol and not only the exported ones. A Swift declaration with no
      # access modifier links internal, so `nm -gU` reads zero for `UploadModel` too, on a
      # binary that plainly contains it — an arm that answers zero whether or not the thing
      # is there. And it must be shown to read a positive, or a zero proves nothing, so the
      # same command is run for a type this app cannot be built without: if that reads zero
      # the instrument is inert and the step fails saying so, rather than passing on a
      # number it could not have produced. Measured while this step was written: on the
      # Release binary `nm` reads 0 for the control and 115 for `UploadModel`, and on a
      # Debug build's `Dunnage.debug.dylib` — where a Debug build keeps the app's code —
      # it reads 72 for the control. The instrument can see one; here it does not.
      #
      # The second reads the sources, excluding by path prefix and not by content: a line
      # that merely mentioned `NegativeControl` would otherwise exclude itself, which is
      # how the wrap site's own comment slipped through a content filter. `UploadModel`
      # names the directory, never the type, so a wrap site that started naming it would
      # be caught here rather than only in the symbol table.
      - name: No release path carries the negative control
        run: |
          set -u
          failed=0
          xcodebuild build \
            -project App/Dunnage.xcodeproj -scheme Dunnage -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/release" > "$RUNNER_TEMP/release-build.log" 2>&1 \
            || { echo "::error::the Release build failed"; tail -20 "$RUNNER_TEMP/release-build.log"; exit 1; }
          binary="$RUNNER_TEMP/release/Build/Products/Release-iphonesimulator/Dunnage.app/Dunnage"
          [ -f "$binary" ] \
            || { echo "::error::the Release build produced no binary at $binary"; exit 1; }
          symbols=$(nm "$binary" | grep -ci forgetful || true)
          sensitivity=$(nm "$binary" | grep -ci uploadmodel || true)
          [ "$sensitivity" -gt 0 ] \
            || { echo "::error::the symbol read is inert — nm found no UploadModel either, so a zero for the control proves nothing"; failed=1; }
          [ "$symbols" -eq 0 ] \
            || { echo "::error::the Release binary carries $symbols symbol(s) naming the negative control"; failed=1; }
          named=$(grep -rn "ForgetfulTransport" App/ \
            | grep -v "^App/Dunnage/NegativeControl/\|^App/DunnageAppTests/\|^App/DunnageAppUITests/" || true)
          [ -z "$named" ] \
            || { echo "::error::the negative control is named outside App/Dunnage/NegativeControl/ and the test bundles: $named"; failed=1; }
          echo "the Release binary carries $symbols symbols naming the control against $sensitivity naming UploadModel, and no source outside NegativeControl/ and the test bundles names it"
          exit $failed

      # One invocation, both bundles: DunnageAppTests is tier 1 on the simulator and
      # DunnageAppUITests is tier 2. The stand-in's base URL reaches the UI-test runner
      # through TEST_RUNNER_ in this step's own environment, which xcodebuild strips before
      # putting the variable in the runner's; the test forwards it to the app as a launch
      # argument. Passed as an environment variable and not as a build setting, which is
      # where the prefix is read from.
      #
      # It is signed ad-hoc for the simulator ("Sign to Run Locally", `App/Shared.xcconfig`)
      # and not built with CODE_SIGNING_ALLOWED=NO, which is what spec §4 asked for. That is
      # an observation and not a mechanism: under XCUITest the ad-hoc build runs its part
      # tasks and the CODE_SIGNING_ALLOWED=NO build fails them at once with
      # NSCocoaErrorDomain 4097, no PUT leaving the process, and the tier-2 test would then
      # measure nothing. The two builds differ as codesign-adhoc (flags=0x2) from
      # linker-signed (flags=0x20002); neither carries an `application-identifier`
      # entitlement, so that is not the difference and is not named as the cause. Which
      # difference causes it is UNVERIFIED and is ADR-0007 O-16. Ad-hoc needs no Apple
      # account, no profile and no team, so the claim CI makes about credentials is
      # unchanged.
      #
      # The two timeout flags are here and nowhere else, because this is the only runner in
      # the repository that implements them: `swift test`'s harness ignores
      # -test-timeouts-enabled entirely, and under the runner xcodebuild drives a hang fails
      # at the allowance with the test named in the failure line and exits 65 (ADR-0007
      # O-17). That is strictly better than the job bound above, which cancels and names
      # nothing. The allowance is per test and bounds test execution only.
      #
      # 300 s: the rule is the slowest per-test duration printed, times four, rounded up to
      # a whole minute, and never below 300. The slowest here was 12.1 s — ControlUITests,
      # measured on this repository's own simulator run — so four times it rounds to one
      # minute and the floor governs. A first CI run that fails at the allowance rather than
      # at an assertion means the number is too tight for a runner slower than that machine:
      # raise it with the observed duration and record it, never drop the flag, which is the
      # only thing that makes a hang name the test.
      - name: Test the app on the simulator
        run: |
          set -u
          TEST_RUNNER_DUNNAGE_STANDIN_BASE_URL="$STANDIN_BASE_URL" \
          xcodebuild test \
            -project App/Dunnage.xcodeproj -scheme Dunnage \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -resultBundlePath "$RUNNER_TEMP/app-tests.xcresult"
          echo "the app's two bundles passed against the stand-in at $STANDIN_BASE_URL, with a 300 s per-test allowance"

      # On failure only, and it is the whole point of writing one: a red on the simulator
      # is diagnosable from the first run rather than from a re-run nobody can reproduce
      # (spec §10 rider b).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-test-results
          path: ${{ runner.temp }}/app-tests.xcresult

      # The third producer, and it reads `enabledTests` only — `vitest list`'s reasoning:
      # a test a plan skips sits in `disabledTests`, and a producer that read both would
      # have docs-agree demand the document name a test nothing runs.
      #
      # The `test` action must be present or the flag builds, exits 0 and writes nothing —
      # a silent nothing, which is exactly the shape R-b is about. Hence the assertion that
      # the file is non-empty before it is uploaded: a broken producer reds here and reds
      # again in docs-agree, and never contributes an empty list that unions away.
      #
      # LC_ALL=C on the sort, for the reason the other two producers pin theirs: sort -u
      # deduplicates by collation, so an unpinned sort decides which names survive into the
      # artifact and no re-sorting downstream recovers a name already dropped.
      - name: Record the test names this runner has
        run: |
          set -u
          xcodebuild test -enumerate-tests \
            -project App/Dunnage.xcodeproj -scheme Dunnage \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -test-enumeration-style flat -test-enumeration-format json \
            -test-enumeration-output-path "$RUNNER_TEMP/app-tests.json"
          jq -r '.values[].enabledTests[].identifier' "$RUNNER_TEMP/app-tests.json" \
            | awk -F/ '{print $NF}' | grep -oE 'test[A-Z][A-Za-z0-9_]*' | LC_ALL=C sort -u > app-test-names.txt
          [ -s app-test-names.txt ] \
            || { echo "::error::the enumeration produced nothing — -enumerate-tests writes a file only when the test action is present"; exit 1; }
          echo "$(wc -l < app-test-names.txt | tr -d '[:space:]') test names recorded"
      - uses: actions/upload-artifact@v7
        with:
          name: app-test-names
          path: app-test-names.txt

      # A shell trap cannot span two steps, and the stand-in is started in one and used in
      # another. This is the same guarantee in the shape the runner has: it runs whatever
      # the steps above did, it stops the process, and it prints that it did (R-b).
      #
      # It shuts down the one udid this run created, by name, and never `simctl shutdown
      # all`: a runner may hold simulators this job did not boot, and on a developer's Mac
      # that blanket command stops work whose owner nobody established. Shut down what you
      # started, and nothing else.
      - name: Stop the stand-in and shut the simulator down
        if: ${{ always() }}
        run: |
          set -u
          if [ -n "${STANDIN_PID:-}" ] && kill "$STANDIN_PID" 2>/dev/null; then
            echo "the stand-in ($STANDIN_PID) was stopped"
          else
            echo "the stand-in was not running by the time this step ran"
          fi
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
            echo "the simulator $SIMULATOR_UDID was shut down and deleted"
          else
            echo "no simulator was created"
          fi

  docs-agree:
    name: docs agree
    # Pinned for the same reason.
    runs-on: ubuntu-24.04
    needs: [build-and-test, cloud-stack, app-simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: swift-test-names
      - uses: actions/download-artifact@v8
        with:
          name: vitest-test-names
      - uses: actions/download-artifact@v8
        with:
          name: app-test-names

      # A doc that can drift from the suites is worse than a doc that names no tests at
      # all. Renaming a test fails this job until docs/invariants.md is updated; the
      # build itself still passes. That is the point of this step, not a side effect of
      # it.
      #
      # It greps the whole file, not one section of it, so where in docs/invariants.md
      # the names are written is free to change. What is enforced is that every name in
      # either suite appears somewhere in the file, and that nothing shaped like a test
      # name appears in the file which is not one.
      #
      # One document, three suites, one comparison. docs/invariants.md names every test
      # there is, whichever runner has it, so the side it is compared against is the
      # union of the lists the runners uploaded — not one list per runner. A per-runner
      # comparison would fail every name another runner owns.
      #
      # The sides of the comparison are produced on four different machines — each
      # suite's names are sorted and uploaded by its own build job's runner, the
      # document's are grepped here — and diff compares lines in order, so one set in two
      # orders is a disagreement. Hence the pinned collation on every sort below. It is
      # what makes this guard independent of its producers: an artifact is a set, its
      # order is not the producer's to guarantee, and this comparison must not depend on
      # which machine wrote the files it reads. Each producer pins its own sort as well,
      # for a reason of its own — sort -u deduplicates by collation, so an unpinned
      # producer would decide its artifact's membership and not merely its order.
      #
      # Sets, then, not sequences. The claims guard below compares its two lists in order
      # deliberately, and says so; here the order carries nothing, and sorting every side
      # under one collation is what makes "the same names" a question three machines can
      # answer the same way.
      - name: docs/invariants.md names the tests that exist
        run: |
          set -u
          # A runner that reported nothing produces an empty list, not an error, and an
          # empty list unions away without trace: the guard would then be reconciling the
          # document against the other runner alone and passing green. Each list has to
          # be non-empty before it is used, and this is checked per file so one run names
          # every runner that went silent.
          empty=0
          for f in swift-test-names.txt vitest-test-names.txt app-test-names.txt; do
            [ -s "$f" ] || { echo "::error::$f is empty — a runner reported no test names, and an empty list unions away without trace"; empty=1; }
          done
          [ "$empty" -eq 0 ] || exit 1
          names=$(cat swift-test-names.txt vitest-test-names.txt app-test-names.txt | LC_ALL=C sort -u)
          diff <(grep -oE 'test[A-Z][A-Za-z0-9_]*' docs/invariants.md | LC_ALL=C sort -u) <(printf '%s\n' "$names") \
            || { echo "::error::docs/invariants.md and the suites disagree — '<' is in the doc only, '>' is in a suite only"; exit 1; }
          echo "$(printf '%s\n' "$names" | wc -l) test names across both suites, docs/invariants.md and the suites agree"

      # Both files state the claims, and that duplication is deliberate: each has to be
      # readable on its own, and the claims are what makes either one readable. Nothing
      # else reconciles the two copies — the step above reads only docs/invariants.md, so
      # a claim reworded in one file and not the other clears every other check here.
      #
      # Compared in order, not as sets. A phase's claims are a deliberate sequence, and a
      # reader holding the two files side by side should not have to hunt.
      #
      # The count guard is the substance of this step, not paperwork around it. Each side
      # is extracted by pattern — a list marker here, a heading level there — and a pattern
      # that stops matching returns an empty list, not an error. A renamed section or a
      # changed heading level would empty one side; two empty lists diff clean, and the
      # step would pass green forever while reading nothing. Landing an invariant is a
      # deliberate act: land it, then change its phase's number below.
      - name: README and docs/invariants.md state the same claims, phase by phase
        run: |
          set -u
          failed=0
          check() {                        # check PHASE EXPECTED
            phase=$1; expected=$2
            readme=$(mktemp); doc=$(mktemp)
            sed -n "/^## Phase $phase: /,/^## /p" README.md          | sed -n 's/^- //p'   > "$readme"
            sed -n "/^## Phase $phase: /,/^## /p" docs/invariants.md | sed -n 's/^### //p' > "$doc"
            rn=$(wc -l < "$readme" | tr -d '[:space:]')
            dn=$(wc -l < "$doc" | tr -d '[:space:]')
            if [ "$rn" -ne "$expected" ] || [ "$dn" -ne "$expected" ]; then
              echo "::error::phase $phase: the claim extraction is broken, so this step read nothing it could compare — expected $expected claims on each side, README.md gave $rn and docs/invariants.md gave $dn"
              failed=1
              return
            fi
            if ! diff "$readme" "$doc"; then
              echo "::error::phase $phase: the claims disagree — '<' is in README.md only, '>' is in docs/invariants.md only"
              failed=1
              return
            fi
            echo "phase $phase: $expected claims, README.md and docs/invariants.md agree, in the same order"
          }
          check 1 9
          check 2 6
          check 3 7
          check 4a 6
          check 5 7
          exit $failed

  commit-message-hygiene:
    name: commit message hygiene
    # Pinned for the same reason. This job needs git and awk, nothing else.
    runs-on: ubuntu-24.04
    # The commit-msg hook cannot be the enforcement layer: rebase, cherry-pick and
    # --no-verify all skip it, and a clone does not install it at all. This job is the
    # layer that sees the history as pushed.
    #
    # It is a policy implementation, not an independent verifier. The classifier it runs
    # is the copy in the commit under test, so a commit that edits .githooks/attribution.awk
    # is judged by its own edited rules. Review changes to that file as production code.
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit message means every commit message. A shallow clone would pass
          # over a history it never fetched.
          fetch-depth: 0

      - name: Attribution trailers
        run: |
          set -u
          checked=0; found=0
          for sha in $(git rev-list HEAD); do
            checked=$((checked + 1))
            # attribution.awk is the one definition of a prohibited line form, and it
            # reads trailer shapes, not prose. A body that names a vendor is not a claim
            # of authorship; grepping the body would fail those commits.
            git log -1 --format=%B "$sha" \
              | LC_ALL=C awk -f .githooks/attribution.awk -v mode=detect -v label="$sha  " \
              || found=1
          done
          echo "$checked commit messages classified"
          [ "$found" -eq 0 ] || { echo "::error::prohibited attribution trailer, listed above"; exit 1; }

      # Runs even when the step above failed, so one run reports both audits.
      - name: Author and committer identity
        if: ${{ !cancelled() }}
        run: |
          set -u
          # Narrow on purpose, for the reason attribution.awk gives about trailers: a
          # rule wide enough to catch every mention of the vendor also rejects people.
          # Each field is tested on its own terms — the name for equality, the email
          # for its domain — so Jean-Claude Martin and Claude Dupont <claude@corp.com>
          # are contributors, not tooling.
          tooling() {                       # tooling NAME EMAIL
            name=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            mail=$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')
            [ "$name" = "claude" ] && return 0
            case "$mail" in *@anthropic.com|*.anthropic.com) return 0 ;; esac
            return 1
          }
          checked=0; found=0
          for sha in $(git rev-list HEAD); do
            checked=$((checked + 1))
            an=$(git log -1 --format='%an' "$sha")
            ae=$(git log -1 --format='%ae' "$sha")
            cn=$(git log -1 --format='%cn' "$sha")
            ce=$(git log -1 --format='%ce' "$sha")
            if tooling "$an" "$ae" || tooling "$cn" "$ce"; then
              echo "$sha  author $an <$ae> | committer $cn <$ce>"
              found=1
            fi
          done
          echo "$checked author and committer identities checked"
          [ "$found" -eq 0 ] || { echo "::error::commit recorded under a tooling identity, listed above"; exit 1; }
